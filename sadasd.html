<body>
  <script>
    const values = [1, 10, 4, 3, 15, 3, 5, 2];

    let total = 100

    for (let i = values.length - 2; i >= 0; i -= 2) {
      console.log(total);
      let a = values[i];
      total /= a;
      total += 10;
    }

    // svaki put novi total 100 / 5 = 20 + total+=10 total ukupno 30,  novi iteration total 30 / 15 = 2 + 10 = 12, novi iteration 12 / 4 = 3 + 10 = 13, i zadnji 13 / 1 = 13 + 10 total 23...
    console.log(total);
  </script>
</body>
